name: Build PHP CLI (Unix)

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP minor version
        required: true
        default: "8.5"
        type: choice
        options:
          - "8.5"
          - "8.4"
          - "8.3"
          - "8.2"
      channel:
        description: Extension channel
        required: true
        default: common
        type: choice
        options:
          - common
          - laravel
          - minimal

permissions:
  contents: read

env:
  PHP_VERSION: ${{ inputs.php_version || '8.5' }}
  PHP_SAPI: cli
  BUILD_CHANNEL: ${{ inputs.channel || 'common' }}
  PHP_BUILD_PROVIDER: "https://github.com/edram/mise-php"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: PHP ${{ inputs.php_version || '8.5' }} CLI ${{ matrix.target }} (${{ inputs.channel || 'common' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        working-directory: static-php-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            upx_supported: true
            spc_libc: musl
          - target: linux-x86_64-gnu
            runner: ubuntu-22.04
            upx_supported: false
            spc_libc: glibc
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            upx_supported: true
            spc_libc: musl
          - target: linux-aarch64-gnu
            runner: ubuntu-22.04-arm
            upx_supported: false
            spc_libc: glibc
          - target: macos-x86_64
            runner: macos-15-intel
            upx_supported: false
            spc_libc: ""
          - target: macos-aarch64
            runner: macos-15
            upx_supported: false
            spc_libc: ""

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6
        with:
          path: mise-php

      - name: Checkout StaticPHP
        uses: actions/checkout@v6
        with:
          repository: crazywhalecc/static-php-cli
          ref: main
          path: static-php-cli

      - name: Select extension channel
        id: channel
        shell: bash
        working-directory: mise-php
        env:
          SPC_LIBC_VALUE: ${{ matrix.spc_libc }}
          UPX_SUPPORTED: ${{ matrix.upx_supported }}
        run: |
          jq -r \
            --arg channel "$BUILD_CHANNEL" \
            --arg libc "$SPC_LIBC_VALUE" \
            --argjson upx_supported "$UPX_SUPPORTED" '
            .[$channel] |
            (.excluded_extensions[$libc] // []) as $excluded_extensions |
            "extensions=\(.extensions - $excluded_extensions | join(","))",
            "build_options=\(.build_options | tojson)",
            "upx_enabled=\(.upx and $upx_supported)"
          ' channels.json >> "$GITHUB_OUTPUT"

      - name: Setup PHP build runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: static-php-cli/vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static-php-cli/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache downloaded build artifacts
        uses: actions/cache@v5
        with:
          path: static-php-cli/downloads
          key: spc-v2-${{ env.PHP_VERSION }}-${{ matrix.target }}-${{ env.BUILD_CHANNEL }}

      - name: Install StaticPHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

      - name: Install GNU system libraries
        if: matrix.spc_libc == 'glibc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev unixodbc-dev

      - name: Configure StaticPHP toolchain
        if: matrix.spc_libc != ''
        shell: bash
        env:
          SPC_LIBC_VALUE: ${{ matrix.spc_libc }}
        run: |
          echo "SPC_LIBC=$SPC_LIBC_VALUE" >> "$GITHUB_ENV"
          if [[ "$SPC_LIBC_VALUE" == "glibc" ]]; then
            # StaticPHP v2 only considers system libraries when PKG_CONFIG_PATH is explicit.
            # See: https://github.com/crazywhalecc/static-php-cli/pull/1056
            SYSTEM_PKG_CONFIG_PATH="$(pkg-config --variable pc_path pkg-config)"
            if [[ -z "$SYSTEM_PKG_CONFIG_PATH" ]]; then
              echo "Cannot resolve the system pkg-config search path"
              exit 1
            fi
            echo "PKG_CONFIG_PATH=$SYSTEM_PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          fi

      - name: Check build environment
        run: bin/spc doctor --auto-fix

      - name: Install UPX
        if: steps.channel.outputs.upx_enabled == 'true'
        run: bin/spc install-pkg upx

      - name: Download PHP sources
        shell: bash
        env:
          EXTENSIONS: ${{ steps.channel.outputs.extensions }}
        run: |
          DOWNLOAD_OPTIONS=(--retry=5 --ignore-cache-sources=php-src)
          if [[ "${SPC_LIBC:-}" == "musl" ]]; then
            DOWNLOAD_OPTIONS+=(--prefer-pre-built)
          fi

          bin/spc download \
            --with-php="$PHP_VERSION" \
            --for-extensions="$EXTENSIONS" \
            "${DOWNLOAD_OPTIONS[@]}"

      - name: Build PHP CLI
        shell: bash
        env:
          EXTENSIONS: ${{ steps.channel.outputs.extensions }}
          CHANNEL_BUILD_OPTIONS: ${{ steps.channel.outputs.build_options }}
          UPX_ENABLED: ${{ steps.channel.outputs.upx_enabled }}
        run: |
          BUILD_OPTIONS=(--build-cli --debug)
          if [[ "${SPC_LIBC:-}" == "musl" ]]; then
            # Fully static musl builds cannot safely use Opcache JIT.
            # See: https://github.com/php/frankenphp/blob/main/build-static.sh
            BUILD_OPTIONS+=(--disable-opcache-jit)
          fi
          if [[ "$UPX_ENABLED" == "true" ]]; then
            BUILD_OPTIONS+=(--with-upx-pack)
          fi
          while IFS= read -r OPTION; do
            BUILD_OPTIONS+=("$OPTION")
          done < <(jq -r '.[]' <<< "$CHANNEL_BUILD_OPTIONS")

          bin/spc build "${BUILD_OPTIONS[@]}" "$EXTENSIONS"

      - name: Validate GNU dynamic dependencies
        if: matrix.spc_libc == 'glibc'
        shell: bash
        run: |
          ldd buildroot/bin/php | tee php-ldd.txt
          grep -q 'libssl\.so\.3' php-ldd.txt
          grep -q 'libcrypto\.so\.3' php-ldd.txt
          if [[ "$BUILD_CHANNEL" == "laravel" ]]; then
            grep -q 'libodbc\.so\.2' php-ldd.txt
            grep -q 'libodbcinst\.so\.2' php-ldd.txt
          fi

      - name: Package PHP
        id: package
        shell: bash
        run: |
          PHP_PATCH_VERSION="$(buildroot/bin/php -r 'echo PHP_VERSION;')"
          if [[ -z "$PHP_PATCH_VERSION" ]]; then
            echo "Cannot resolve the built PHP version"
            exit 1
          fi

          PACKAGE_ROOT="package"
          ARCHIVE_NAME="php-$PHP_PATCH_VERSION-$PHP_SAPI-$BUILD_CHANNEL-${{ matrix.target }}.tar.gz"
          ARCHIVE="dist/$ARCHIVE_NAME"
          mkdir -p "$PACKAGE_ROOT" dist
          install -m 755 buildroot/bin/php "$PACKAGE_ROOT/php"
          tar -czf "$ARCHIVE" -C "$PACKAGE_ROOT" .
          echo "php_version=$PHP_PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload PHP archive
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ steps.package.outputs.php_version }}-${{ env.PHP_SAPI }}-${{ env.BUILD_CHANNEL }}-${{ matrix.target }}
          path: static-php-cli/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="php-${{ steps.package.outputs.php_version }}-$PHP_SAPI-$BUILD_CHANNEL"
          ARCHIVE_NAME="${{ steps.package.outputs.archive_name }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if ! gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PHP ${{ steps.package.outputs.php_version }} CLI ($BUILD_CHANNEL)" \
              --notes "Precompiled PHP ${{ steps.package.outputs.php_version }} CLI with the $BUILD_CHANNEL extension channel."
            then
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
            fi
          fi

          gh release upload "$TAG" \
            "dist/$ARCHIVE_NAME" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spc-logs-${{ env.PHP_VERSION }}-${{ matrix.target }}
          path: static-php-cli/log/*.log
          if-no-files-found: ignore
          retention-days: 14
