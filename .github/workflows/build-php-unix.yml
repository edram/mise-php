name: Build PHP CLI (Unix)

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP minor version
        required: true
        default: "8.5"
        type: choice
        options:
          - "8.5"
          - "8.4"
          - "8.3"
          - "8.2"
      channel:
        description: Extension channel
        required: true
        default: common
        type: choice
        options:
          - common
          - laravel
          - minimal

permissions:
  contents: read

env:
  PHP_VERSION: ${{ inputs.php_version || '8.5' }}
  PHP_SAPI: cli
  BUILD_CHANNEL: ${{ inputs.channel || 'common' }}
  PHP_BUILD_PROVIDER: "https://github.com/edram/mise-php"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: PHP ${{ inputs.php_version || '8.5' }} CLI ${{ matrix.target }} (${{ inputs.channel || 'common' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        working-directory: static-php-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            upx: true
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            upx: true
          - target: macos-x86_64
            runner: macos-15-intel
            upx: false
          - target: macos-aarch64
            runner: macos-15
            upx: false

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6
        with:
          path: mise-php

      - name: Checkout StaticPHP
        uses: actions/checkout@v6
        with:
          repository: crazywhalecc/static-php-cli
          ref: v3
          path: static-php-cli

      - name: Select extension channel
        id: channel
        shell: bash
        working-directory: mise-php
        run: |
          jq -r --arg channel "$BUILD_CHANNEL" '
            .[$channel] |
            "extensions=\(.extensions | join(","))",
            "build_options=\(.build_options | tojson)"
          ' channels.json >> "$GITHUB_OUTPUT"

      - name: Setup PHP build runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: static-php-cli/vendor
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static-php-cli/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache downloaded build artifacts
        uses: actions/cache@v5
        with:
          path: static-php-cli/downloads
          key: spc-v3-${{ env.PHP_VERSION }}-${{ matrix.target }}-${{ env.BUILD_CHANNEL }}

      - name: Install StaticPHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

      - name: Check build environment
        run: bin/spc doctor --auto-fix

      - name: Install UPX
        if: matrix.upx
        run: bin/spc install-pkg upx

      - name: Build PHP CLI
        shell: bash
        env:
          EXTENSIONS: ${{ steps.channel.outputs.extensions }}
          CHANNEL_BUILD_OPTIONS: ${{ steps.channel.outputs.build_options }}
        run: |
          BUILD_OPTIONS=(--build-cli --debug)
          if [[ "${{ matrix.upx }}" == "true" ]]; then
            BUILD_OPTIONS+=(--with-upx-pack)
          fi
          while IFS= read -r OPTION; do
            BUILD_OPTIONS+=("$OPTION")
          done < <(jq -r '.[]' <<< "$CHANNEL_BUILD_OPTIONS")

          bin/spc build \
            "${BUILD_OPTIONS[@]}" \
            "$EXTENSIONS" \
            --dl-with-php="$PHP_VERSION" \
            --dl-retry=5 \
            --dl-prefer-binary \
            --dl-ignore-cache=php-src

      - name: Package PHP
        id: package
        shell: bash
        run: |
          bin/spc dev:info php --json --no-ansi > php-info.json
          # $info is PHP syntax and must not be expanded by Bash.
          # shellcheck disable=SC2016
          PHP_PATCH_VERSION="$(php -r '$info = json_decode(file_get_contents("php-info.json"), true); echo $info["cache"]["source"]["info"]["version"] ?? "";')"
          if [[ -z "$PHP_PATCH_VERSION" ]]; then
            echo "Cannot resolve the built PHP version"
            exit 1
          fi

          PACKAGE_ROOT="package"
          ARCHIVE_NAME="php-$PHP_PATCH_VERSION-$PHP_SAPI-$BUILD_CHANNEL-${{ matrix.target }}.tar.gz"
          ARCHIVE="dist/$ARCHIVE_NAME"
          mkdir -p "$PACKAGE_ROOT" dist
          install -m 755 buildroot/bin/php "$PACKAGE_ROOT/php"
          tar -czf "$ARCHIVE" -C "$PACKAGE_ROOT" php
          echo "php_version=$PHP_PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload PHP archive
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ steps.package.outputs.php_version }}-${{ env.PHP_SAPI }}-${{ env.BUILD_CHANNEL }}-${{ matrix.target }}
          path: static-php-cli/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="php-${{ steps.package.outputs.php_version }}-$PHP_SAPI-$BUILD_CHANNEL"
          ARCHIVE_NAME="${{ steps.package.outputs.archive_name }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if ! gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PHP ${{ steps.package.outputs.php_version }} CLI ($BUILD_CHANNEL)" \
              --notes "Precompiled PHP ${{ steps.package.outputs.php_version }} CLI with the $BUILD_CHANNEL extension channel."
            then
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
            fi
          fi

          gh release upload "$TAG" \
            "dist/$ARCHIVE_NAME" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spc-logs-${{ env.PHP_VERSION }}-${{ matrix.target }}
          path: static-php-cli/log/*.log
          if-no-files-found: ignore
          retention-days: 14
